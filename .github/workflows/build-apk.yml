name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install buildozer dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Cython and Buildozer
        run: |
          pip3 install --upgrade Cython==0.29.33
          pip3 install buildozer

      - name: Build APK with Buildozer
        run: |
          buildozer init
          # Настройка buildozer.spec под наше приложение
          sed -i 's/title = My Application/title = WeldingJournal/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = weldingjournal/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.welding/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.3.0,kivymd==1.1.1/' buildozer.spec
          sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,json/' buildozer.spec
          sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET, WRITE_EXTERNAL_STORAGE/' buildozer.spec
          sed -i 's/# android.api = 30/android.api = 33/' buildozer.spec
          sed -i 's/# android.minapi = 21/android.minapi = 21/' buildozer.spec
          sed -i 's/# android.ndk = 23b/android.ndk = 23b/' buildozer.spec
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeldingJournal-APK
          path: bin/*.apk
